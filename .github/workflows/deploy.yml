name: بناء ونشر على GitHub Pages

on:
  push:
    branches: [main, claude/hikayat-tawzee-interactive-noz91f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # فحص الواجهة في متصفح حقيقي على عرضي 390 و1440: تمرير أفقي، ومعادلات أعرض من حاويتها،
      # وتداخل تسميات الشجرة، وطول المشاهد على الجوال، ولوحة المفاتيح. يفشل النشر إن وجد مشكلة.
      - run: npx playwright install --with-deps chromium
      - name: فحص الواجهة
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          npm run check:ui
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
